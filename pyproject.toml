[project]
name = "ai-native-compliance-saas-starter-kit"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
    "strands-agents>=1.0",
]

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.89",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
